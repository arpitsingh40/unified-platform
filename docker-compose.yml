version: "3.8"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  kernel:
    build: ./kernel
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://forge:forge@postgres:5432/forge
    depends_on: [postgres]
  business-os:
    build: ./business-os
    ports: ["8000:8000"]
    environment:
      MONGO_URL: mongodb://mongo:27017/forge
      DATABASE_URL: postgres://forge:forge@postgres:5432/forge
    depends_on: [postgres, mongo, kernel]
volumes:
  pgdata:
  mongodata:
