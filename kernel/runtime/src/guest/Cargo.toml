[package]
name = "ari-guest"
version = "0.1.0"
edition = "2021"
description = "ARI Guest SDK - Write agents for the ARI runtime"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
wit-bindgen = { version = "0.35", features = ["guest"] }