[package]
name = "ari-cli"
version = "0.1.0"
edition = "2021"
description = "ARI CLI - Build, deploy, and run agents"
license = "Apache-2.0"

[dependencies]
ari-runtime-host = { path = "../runtime/src/host" }
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"
indicatif = "0.17"
console = "0.15"
toml = "0.8"
sha2 = "0.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "ari"
path = "src/main.rs"