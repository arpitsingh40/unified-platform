app = "smartdecigen"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "get"
    path = "/api/"
    protocol = "http"

[env]
  LLM_PROVIDER = "deepseek"
  CORS_ORIGINS = "*"
  DISABLE_DOCS = "1"
  SIGNUP_CREDITS = "200"
  TURN_COST = "5"
  ULTRA_TURN_COST = "10"
  FRONTEND_BASE_URL = "https://smartdecigen.fly.dev"

[[services]]
  protocol = "tcp"
  internal_port = 8000
  ports = [{ port = 443, handlers = ["tls", "http"] }]
